name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']   # для тегов фильтр paths не применяется — релиз собирается всегда
    paths:
      - 'www/**'
      - 'android/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK (платформа 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Зависимости
        run: npm ci

      - name: Проверка парсеров и хранилища
        run: npm run test:step

      - name: Веб-часть → Android-проект
        run: npm run sync

      - name: Ключ подписи из секретов (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.SHAGI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shagi.keystore"
            echo "SHAGI_KEYSTORE_FILE=$RUNNER_TEMP/shagi.keystore" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом из секретов"
          else
            echo "::warning::Секрет SHAGI_KEYSTORE_BASE64 не задан — APK подписан временным debug-ключом. Обновление поверх ранее установленной версии может не встать (см. README)."
          fi

      - name: Сборка APK
        working-directory: android
        env:
          SHAGI_KEYSTORE_PASSWORD: ${{ secrets.SHAGI_KEYSTORE_PASSWORD }}
          SHAGI_KEY_ALIAS: ${{ secrets.SHAGI_KEY_ALIAS }}
          SHAGI_KEY_PASSWORD: ${{ secrets.SHAGI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$SHAGI_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/12-shagov.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/12-shagov.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 12-shagov-apk
          path: dist/12-shagov.apk

      - name: Релиз с APK (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/12-shagov.apk
