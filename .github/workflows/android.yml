name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']   # для тегов фильтр paths не применяется — релиз собирается всегда
    paths:
      - 'www/**'
      - 'android/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK (платформа 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Зависимости
        run: npm ci

      - name: Проверка парсеров и хранилища
        run: npm run test:step

      - name: Веб-часть → Android-проект
        run: npm run sync

      - name: Ключ подписи из секретов (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.SHAGI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shagi.keystore"
            echo "SHAGI_KEYSTORE_FILE=$RUNNER_TEMP/shagi.keystore" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом из секретов"
          else
            echo "::warning::Секрет SHAGI_KEYSTORE_BASE64 не задан — APK подписан временным debug-ключом. Для установки рядом со старым приложением есть 12-shagov-new.apk. Не удаляйте приложение с записями."
          fi

      - name: Сборка APK
        working-directory: android
        env:
          SHAGI_KEYSTORE_PASSWORD: ${{ secrets.SHAGI_KEYSTORE_PASSWORD }}
          SHAGI_KEY_ALIAS: ${{ secrets.SHAGI_KEY_ALIAS }}
          SHAGI_KEY_PASSWORD: ${{ secrets.SHAGI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$SHAGI_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/12-shagov.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/12-shagov.apk
          fi

      - name: Отдельный APK для установки рядом со старой версией
        working-directory: android
        env:
          SHAGI_PARALLEL_INSTALL: 'true'
          SHAGI_KEYSTORE_PASSWORD: ${{ secrets.SHAGI_KEYSTORE_PASSWORD }}
          SHAGI_KEY_ALIAS: ${{ secrets.SHAGI_KEY_ALIAS }}
          SHAGI_KEY_PASSWORD: ${{ secrets.SHAGI_KEY_PASSWORD }}
        run: |
          if [ -n "$SHAGI_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/12-shagov-new.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/12-shagov-new.apk
          fi

      - name: Проверка подписи и отдельного идентификатора
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/12-shagov.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/12-shagov-new.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/12-shagov-new.apk > "$RUNNER_TEMP/parallel-package.txt"
          grep -F "package: name='io.github.nodensss.shagi.preview'" "$RUNNER_TEMP/parallel-package.txt"
          grep -F "application-label:'12 шагов · новая'" "$RUNNER_TEMP/parallel-package.txt"
          grep -F "launchable-activity: name='io.github.nodensss.shagi.MainActivity'" "$RUNNER_TEMP/parallel-package.txt"

      - name: Проверка заставки внутри собранных APK
        run: |
          python3 scripts/check-apk-entry.py dist/12-shagov.apk
          python3 scripts/check-apk-entry.py dist/12-shagov-new.apk
          python3 -m zipfile -e dist/12-shagov-new.apk "$RUNNER_TEMP/intro-apk"

      - name: Проверка запуска из файлов собранного APK
        run: |
          python3 -m venv "$RUNNER_TEMP/intro-check-env"
          "$RUNNER_TEMP/intro-check-env/bin/pip" install playwright==1.58.0
          INTRO_WEB_ROOT="$RUNNER_TEMP/intro-apk/assets/public" \
          INTRO_REVIEW_DIR="$RUNNER_TEMP/intro-review" \
          CHROMIUM_PATH="$(command -v google-chrome)" \
          "$RUNNER_TEMP/intro-check-env/bin/python" tests/intro-flow.py

      - uses: actions/upload-artifact@v4
        id: apk_artifact
        continue-on-error: ${{ github.ref == 'refs/heads/ccr-904d7ed7-auu10m' || startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: 12-shagov-apk
          path: dist/*.apk

      - name: Ссылка на APK, если хранилище артефактов недоступно
        if: steps.apk_artifact.outcome == 'failure' && github.ref == 'refs/heads/ccr-904d7ed7-auu10m'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Тестовая APK — сборка ${{ github.run_number }}
          prerelease: true
          body: |
            Тестовая сборка Android из ветки ccr-904d7ed7-auu10m.
            12-shagov-new.apk устанавливается рядом со старым приложением как «12 шагов · новая».
            Записи старого приложения остаются в нём и автоматически в отдельную версию не переносятся.
            Материалы добавляются после установки: Шаг 1 → Загрузить материалы в шаг.
            Файл размещён здесь, потому что хранилище артефактов GitHub Actions недоступно.
          files: dist/*.apk
          fail_on_unmatched_files: true

      - name: Релиз с APK (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
